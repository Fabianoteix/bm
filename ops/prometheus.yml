global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - alerts.yml # relativo a este arquivo; no container fica em /etc/prometheus/

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Worker e relay expõem /metrics na porta 9000 (APP_METRICS_PORT).
  # Com réplicas, o DNS do compose resolve para todas as instâncias.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9000

  - job_name: relay
    dns_sd_configs:
      - names: ["relay"]
        type: A
        port: 9000
