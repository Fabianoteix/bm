[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bamaq-transactions"
version = "0.1.0"
description = "Processamento assíncrono de transações financeiras (Kafka + MySQL) em Arquitetura Hexagonal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1",
    "cryptography>=42",
    "alembic>=1.13",
    "confluent-kafka>=2.4",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
transactions-api = "transactions.entrypoints.api:main"
transactions-worker = "transactions.entrypoints.worker:main"
transactions-relay = "transactions.entrypoints.relay:main"
transactions-admin = "transactions.entrypoints.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "e2e: testes ponta a ponta contra o ambiente docker compose (requer E2E_BASE_URL)",
]

[tool.coverage.run]
source = ["src/transactions"]
omit = ["src/transactions/entrypoints/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "ASYNC"]
ignore = ["S101", "RUF012", "B008", "N818"]  # N818: exceções nomeadas na linguagem do domínio

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802"]
"mock_risk_service/*" = ["S311"]
"docs/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["transactions"]
strict = true
ignore_missing_imports = true
