<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect width="1640" height="1090" fill="#ffffff"/><text x="30" y="42" class="h1">BAMAQ Capital · Processamento assíncrono de transações</text><text x="30" y="66" class="sub">Arquitetura Hexagonal · Transactional Outbox · at-least-once + consumidores idempotentes · MySQL é a fonte da verdade</text><rect x="30" y="215" width="130" height="62" rx="10" fill="#fff4e5" stroke="#c77700" stroke-width="1.6"/><text x="95.0" y="237" class="t" font-size="14" text-anchor="middle" fill="#c77700">Cliente</text><text x="95.0" y="256" class="b" text-anchor="middle">canal / parceiro</text><rect x="185" y="118" width="265" height="290" rx="14" fill="#fbfcfe" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/><text x="199" y="138" class="g">API · FastAPI (N réplicas, stateless)</text><rect x="203" y="150" width="229" height="110" rx="10" fill="#e8f1ff" stroke="#2563eb" stroke-width="1.6"/><text x="317.5" y="172" class="t" font-size="14" text-anchor="middle" fill="#2563eb">POST /transactions</text><text x="317.5" y="191" class="b" text-anchor="middle">valida payload (Decimal)</text><text x="317.5" y="207" class="b" text-anchor="middle">Idempotency-Key opcional</text><text x="317.5" y="223" class="b" text-anchor="middle">202 Accepted + Location</text><rect x="203" y="278" width="229" height="110" rx="10" fill="#e8f1ff" stroke="#2563eb" stroke-width="1.6"/><text x="317.5" y="300" class="t" font-size="14" text-anchor="middle" fill="#2563eb">GET /transactions/{id}</text><text x="317.5" y="319" class="b" text-anchor="middle">leitura direta por PK (sem cache)</text><text x="317.5" y="335" class="b" text-anchor="middle">404 Problem+JSON</text><text x="317.5" y="351" class="b" text-anchor="middle">X-Correlation-ID</text><rect x="490" y="88" width="300" height="340" rx="14" fill="#fbfcfe" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/><text x="504" y="108" class="g">MySQL 8 · fonte da verdade</text><rect x="508" y="120" width="264" height="130" rx="10" fill="#eafaf0" stroke="#15803d" stroke-width="1.6"/><text x="640.0" y="142" class="t" font-size="14" text-anchor="middle" fill="#15803d">transactions</text><text x="640.0" y="161" class="b" text-anchor="middle">id · customer_id · value DECIMAL</text><text x="640.0" y="177" class="b" text-anchor="middle">status · attempts · last_error</text><text x="640.0" y="193" class="b" text-anchor="middle">version (lock otimista)</text><text x="640.0" y="209" class="b" text-anchor="middle">UNIQUE(customer_id, idem_key)</text><rect x="508" y="268" width="264" height="140" rx="10" fill="#eafaf0" stroke="#15803d" stroke-width="1.6"/><text x="640.0" y="290" class="t" font-size="14" text-anchor="middle" fill="#15803d">outbox</text><text x="640.0" y="309" class="b" text-anchor="middle">event_id · event_type · topic</text><text x="640.0" y="325" class="b" text-anchor="middle">message_key = transaction_id</text><text x="640.0" y="341" class="b" text-anchor="middle">available_at (retry agendado)</text><text x="640.0" y="357" class="b" text-anchor="middle">published_at · publish_attempts</text><rect x="835" y="268" width="210" height="152" rx="10" fill="#e8f1ff" stroke="#2563eb" stroke-width="1.6"/><text x="940.0" y="290" class="t" font-size="14" text-anchor="middle" fill="#2563eb">Outbox Relay (N)</text><text x="940.0" y="309" class="b" text-anchor="middle">eventos c/ available_at ≤ agora</text><text x="940.0" y="325" class="b" text-anchor="middle">1 reserva c/ lease de 45s</text><text x="940.0" y="341" class="b" text-anchor="middle">2 publica sem transação aberta</text><text x="940.0" y="357" class="b" text-anchor="middle">producer idempotente · acks=all</text><text x="940.0" y="373" class="b" text-anchor="middle">3 marca publicado após o ack</text><text x="940.0" y="389" class="b" text-anchor="middle">relay morreu → lease vence</text><rect x="1090" y="88" width="320" height="385" rx="14" fill="#fbfcfe" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/><text x="1104" y="108" class="g">Kafka · key = transaction_id</text><rect x="1108" y="120" width="284" height="92" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.6"/><text x="1250.0" y="142" class="t" font-size="14" text-anchor="middle" fill="#7e22ce">transactions.processing.v1</text><text x="1250.0" y="161" class="b" text-anchor="middle">ProcessingRequested{attempt}</text><text x="1250.0" y="177" class="b" text-anchor="middle">48 partições · fila de trabalho</text><rect x="1108" y="230" width="284" height="92" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.6"/><text x="1250.0" y="252" class="t" font-size="14" text-anchor="middle" fill="#7e22ce">transactions.events.v1</text><text x="1250.0" y="271" class="b" text-anchor="middle">TransactionCreated</text><text x="1250.0" y="287" class="b" text-anchor="middle">TransactionStatusChanged{version}</text><rect x="1108" y="360" width="284" height="96" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.6"/><text x="1250.0" y="382" class="t" font-size="14" text-anchor="middle" fill="#7e22ce">transactions.processing.dlq.v1</text><text x="1250.0" y="401" class="b" text-anchor="middle">TransactionDeadLettered</text><text x="1250.0" y="417" class="b" text-anchor="middle">poison messages (payload original</text><text x="1250.0" y="433" class="b" text-anchor="middle">+ headers com motivo)</text><rect x="1460" y="236" width="155" height="76" rx="10" fill="#fff4e5" stroke="#c77700" stroke-width="1.6"/><text x="1537.5" y="258" class="t" font-size="14" text-anchor="middle" fill="#c77700">Outros sistemas</text><text x="1537.5" y="277" class="b" text-anchor="middle">consomem status</text><text x="1537.5" y="293" class="b" text-anchor="middle">dedupe por event_id</text><rect x="1448" y="352" width="180" height="118" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4"/><text x="1538.0" y="374" class="t" font-size="14" text-anchor="middle" fill="#64748b">transactions-admin</text><text x="1538.0" y="393" class="b" text-anchor="middle">reprocess · reprocess-failed</text><text x="1538.0" y="409" class="b" text-anchor="middle">FAILED → PENDING</text><text x="1538.0" y="425" class="b" text-anchor="middle">+ novo evento via outbox</text><text x="1538.0" y="441" class="b" text-anchor="middle">purge-outbox</text><rect x="490" y="540" width="920" height="190" rx="14" fill="#fbfcfe" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/><text x="504" y="560" class="g">Worker · consumer group (réplicas ≤ nº de partições)</text><rect x="1150" y="575" width="240" height="138" rx="10" fill="#e8f1ff" stroke="#2563eb" stroke-width="1.6"/><text x="1270.0" y="597" class="t" font-size="14" text-anchor="middle" fill="#2563eb">Kafka Consumer</text><text x="1270.0" y="616" class="b" text-anchor="middle">auto.offset.store = false</text><text x="1270.0" y="632" class="b" text-anchor="middle">offset armazenado só após</text><text x="1270.0" y="648" class="b" text-anchor="middle">COMMIT no MySQL</text><text x="1270.0" y="664" class="b" text-anchor="middle">poison → DLQ · erro infra → seek</text><rect x="835" y="575" width="285" height="138" rx="10" fill="#e8f1ff" stroke="#2563eb" stroke-width="1.6"/><text x="977.5" y="597" class="t" font-size="14" text-anchor="middle" fill="#2563eb">ProcessTransaction (caso de uso)</text><text x="977.5" y="616" class="b" text-anchor="middle">fencing: attempt == attempts + 1</text><text x="977.5" y="632" class="b" text-anchor="middle">UPDATE … WHERE version = ?</text><text x="977.5" y="648" class="b" text-anchor="middle">status + eventos no mesmo COMMIT</text><text x="977.5" y="664" class="b" text-anchor="middle">transitório → RETRYING + retry</text><text x="977.5" y="680" class="b" text-anchor="middle">permanente/esgotou → FAILED</text><rect x="508" y="575" width="297" height="138" rx="10" fill="#e8f1ff" stroke="#2563eb" stroke-width="1.6"/><text x="656.5" y="597" class="t" font-size="14" text-anchor="middle" fill="#2563eb">RiskAnalysis HTTP adapter</text><text x="656.5" y="616" class="b" text-anchor="middle">timeout connect 1s / read 3s</text><text x="656.5" y="632" class="b" text-anchor="middle">2 retries curtos c/ jitter</text><text x="656.5" y="648" class="b" text-anchor="middle">circuit breaker (5 falhas / 30s)</text><text x="656.5" y="664" class="b" text-anchor="middle">5xx·408·429·timeout = transitório</text><text x="656.5" y="680" class="b" text-anchor="middle">4xx·contrato inválido = permanente</text><rect x="203" y="606" width="229" height="76" rx="10" fill="#fff4e5" stroke="#c77700" stroke-width="1.6"/><text x="317.5" y="628" class="t" font-size="14" text-anchor="middle" fill="#c77700">Serviço de risco</text><text x="317.5" y="647" class="b" text-anchor="middle">POST /risk-analysis</text><text x="317.5" y="663" class="b" text-anchor="middle">Idempotency-Key = tx id</text><path d="M 160 238 L 203 206" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="180" cy="206" r="11" fill="#0f172a"/><text x="180" y="210.5" class="n" text-anchor="middle">1</text><path d="M 160 258 L 203 330" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="95" y="305" class="l" text-anchor="middle">polling</text><path d="M 432 196 L 508 196" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="470" cy="180" r="11" fill="#0f172a"/><text x="470" y="184.5" class="n" text-anchor="middle">2</text><text x="462" y="222" class="l" text-anchor="middle">1 COMMIT:</text><text x="462" y="236" class="l" text-anchor="middle">tx + outbox</text><path d="M 432 330 L 478 330 L 478 240 L 508 240" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="455" y="322" class="l" text-anchor="middle">PK</text><path d="M 772 338 L 835 338" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="803" cy="322" r="11" fill="#0f172a"/><text x="803" y="326.5" class="n" text-anchor="middle">3</text><path d="M 1045 338 L 1090 338" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="1067" cy="322" r="11" fill="#0f172a"/><text x="1067" y="326.5" class="n" text-anchor="middle">4</text><path d="M 1392 166 L 1432 166 L 1432 644 L 1390 644" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="1432" cy="520" r="11" fill="#0f172a"/><text x="1432" y="524.5" class="n" text-anchor="middle">5</text><path d="M 1150 644 L 1120 644" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 835 644 L 805 644" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="820" cy="628" r="11" fill="#0f172a"/><text x="820" y="632.5" class="n" text-anchor="middle">6</text><path d="M 508 644 L 432 644" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 930 575 L 930 505 L 740 505 L 740 408" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="930" cy="520" r="11" fill="#0f172a"/><text x="930" y="524.5" class="n" text-anchor="middle">7</text><text x="836" y="478" class="l" text-anchor="middle">UPDATE status + outbox</text><text x="836" y="492" class="l" text-anchor="middle">(StatusChanged · retry · DLQ)</text><path d="M 1250 575 L 1250 456" fill="none" stroke="#be123c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="1258" y="520" class="l" text-anchor="start">poison / órfã</text><path d="M 1392 274 L 1460 274" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/><circle cx="1426" cy="258" r="11" fill="#0f172a"/><text x="1426" y="262.5" class="n" text-anchor="middle">8</text><path d="M 1392 408 L 1448 408" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="30" y="775" class="h2">Cenários de falha</text><rect x="30" y="790" width="306" height="185" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/><rect x="30" y="790" width="306" height="30" rx="10" fill="#be123c"/><rect x="30" y="808" width="306" height="12" fill="#be123c"/><text x="42" y="810" class="ct">C1 · Kafka fora após commit</text><text x="42" y="840" class="cb">O evento já está no outbox, gravado no MESMO</text><text x="42" y="855.5" class="cb">COMMIT da transação. Não existe dual write.</text><text x="42" y="876.0" class="cb">Relay re-tenta com backoff; nada se perde. A</text><text x="42" y="891.5" class="cb">API continua aceitando (readiness não</text><text x="42" y="907.0" class="cb">depende do Kafka).</text><text x="42" y="927.5" class="cb">Alerta: outbox_oldest_pending_age_seconds.</text><rect x="350" y="790" width="306" height="185" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/><rect x="350" y="790" width="306" height="30" rx="10" fill="#be123c"/><rect x="350" y="808" width="306" height="12" fill="#be123c"/><text x="362" y="810" class="ct">C2 · Crash antes do commit do offset</text><text x="362" y="840" class="cb">Offset só é armazenado depois do COMMIT no</text><text x="362" y="855.5" class="cb">MySQL → a mensagem é reentregue (at-least-</text><text x="362" y="871.0" class="cb">once).</text><text x="362" y="891.5" class="cb">Fencing: status final ou attempt ≠</text><text x="362" y="907.0" class="cb">attempts+1 → DUPLICATE, ack sem efeito</text><text x="362" y="922.5" class="cb">colateral.</text><rect x="670" y="790" width="306" height="185" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/><rect x="670" y="790" width="306" height="30" rx="10" fill="#be123c"/><rect x="670" y="808" width="306" height="12" fill="#be123c"/><text x="682" y="810" class="ct">C3 · Risco indisponível por 30 min</text><text x="682" y="840" class="cb">Timeouts curtos + 2 retries rápidos; circuit</text><text x="682" y="855.5" class="cb">breaker abre e passa a falhar rápido.</text><text x="682" y="876.0" class="cb">Retry agendado = outbox.available_at:</text><text x="682" y="891.5" class="cb">5s·10s·20s…10min (±20% jitter), 12</text><text x="682" y="907.0" class="cb">tentativas ≈ 50 min. Partição não trava.</text><text x="682" y="927.5" class="cb">Esgotou → FAILED + DLQ → reprocess.</text><rect x="990" y="790" width="306" height="185" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/><rect x="990" y="790" width="306" height="30" rx="10" fill="#be123c"/><rect x="990" y="808" width="306" height="12" fill="#be123c"/><text x="1002" y="810" class="ct">C4 · Mensagem duplicada</text><text x="1002" y="840" class="cb">Tentativa já consumida ou status final →</text><text x="1002" y="855.5" class="cb">descartada.</text><text x="1002" y="876.0" class="cb">Corrida em rebalance: UPDATE … WHERE</text><text x="1002" y="891.5" class="cb">version=? (só um vence).</text><text x="1002" y="912.0" class="cb">Idempotency-Key no POST (UNIQUE) e na</text><text x="1002" y="927.5" class="cb">chamada ao risco; consumidores externos usam</text><text x="1002" y="943.0" class="cb">event_id + version.</text><rect x="1310" y="790" width="306" height="185" rx="10" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/><rect x="1310" y="790" width="306" height="30" rx="10" fill="#be123c"/><rect x="1310" y="808" width="306" height="12" fill="#be123c"/><text x="1322" y="810" class="ct">C5 · 100 → 10.000 eventos/min</text><text x="1322" y="840" class="cb">~167/s. API, relay e worker são stateless →</text><text x="1322" y="855.5" class="cb">escala horizontal.</text><text x="1322" y="876.0" class="cb">48 partições desde o dia 1: escalar = subir</text><text x="1322" y="891.5" class="cb">workers, sem reparticionar.</text><text x="1322" y="912.0" class="cb">Gargalo real: latência do risco →</text><text x="1322" y="927.5" class="cb">concorrência por worker, pool HTTP, alerta</text><text x="1322" y="943.0" class="cb">de consumer lag.</text><rect x="30" y="995" width="1580" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4"/><text x="820.0" y="1017" class="t" font-size="14" text-anchor="middle" fill="#64748b">Observabilidade</text><text x="820.0" y="1036" class="b" text-anchor="middle">Logs JSON (structlog) com correlation_id · transaction_id · event_id · partition/offset   ·   Prometheus: HTTP RED, outcomes por tipo, retries, DLQ, lag do outbox, latência do risco, estado do breaker POR worker (0/1/2), consumer pausado</text><text x="820.0" y="1052" class="b" text-anchor="middle">correlation_id propagado HTTP → outbox → headers Kafka → worker → chamada ao risco   ·   alertas versionados (ops/alerts.yml, testados com promtool) · painel Grafana por worker</text><rect x="1010" y="26" width="14" height="14" rx="3" fill="#e8f1ff" stroke="#2563eb"/><text x="1030" y="37.5" class="lg">processo da aplicação</text><rect x="1215" y="26" width="14" height="14" rx="3" fill="#eafaf0" stroke="#15803d"/><text x="1235" y="37.5" class="lg">armazenamento</text><rect x="1420" y="26" width="14" height="14" rx="3" fill="#f3e8ff" stroke="#7e22ce"/><text x="1440" y="37.5" class="lg">tópico Kafka</text><rect x="1010" y="48" width="14" height="14" rx="3" fill="#fff4e5" stroke="#c77700"/><text x="1030" y="59.5" class="lg">externo</text><rect x="1215" y="48" width="14" height="14" rx="3" fill="#f1f5f9" stroke="#64748b"/><text x="1235" y="59.5" class="lg">operação</text></svg>